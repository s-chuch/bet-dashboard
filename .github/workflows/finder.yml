name: finder
# Bet Finder: strict +EV scan (scripts/ev_scan.py) -> finder.json at the repo root (outside data/, so autorun is not triggered).
# Public, unauthenticated feeds only (Pinnacle guest API + Action Network). No emails, no issues.
on:
  workflow_dispatch:
  schedule:
    # ET = UTC-4 (EDT); in winter (EST) these fire one hour earlier in ET.
    - cron: "7 19 * * *"     # ~3:07 PM ET
    - cron: "47 21 * * *"    # ~5:47 PM ET
    - cron: "17 14,16,23 * * *"   # ~10:17 AM, 12:17 PM, 7:17 PM ET

permissions: {}

concurrency:
  group: finder
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  scan:
    if: github.repository == 's-chuch/bet-dashboard' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # push finder.json to main
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: true   # required: the retry loop below pushes with this token

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: scan + commit finder.json (retry on push race)
        env:
          TZ: America/Toronto
        run: |
          set -euo pipefail
          git config user.name "bet-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 scripts/ev_scan.py --out finder.json
            git add finder.json
            if git diff --cached --quiet; then echo "no change"; exit 0; fi
            git commit -qm "finder $(date '+%Y-%m-%d %H:%M') ET"
            if git push -q origin HEAD:main; then echo "pushed"; exit 0; fi
            echo "push rejected - redoing on fresh main"; sleep 5
          done
          echo "::error::could not push after 3 attempts"; exit 1
