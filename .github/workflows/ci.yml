name: ci
on:
  pull_request:
  push:
    branches-ignore:
      - main
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Compile scripts
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/*.py

      - name: Validate data
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv, glob, json, os, sys
          errs = []
          def rows(path, required):
              with open(path, newline="", encoding="utf-8") as f:
                  r = csv.DictReader(f)
                  missing = [c for c in required if c not in (r.fieldnames or [])]
                  if missing:
                      errs.append(f"{path}: missing columns {missing}")
                      return []
                  return list(r)
          BET_COLS = ["date", "book", "event", "stake", "result", "pnl", "bet_id"]
          ids = {}
          paths = (["data/bets.csv"] if os.path.exists("data/bets.csv") else []) + sorted(glob.glob("data/archive/bets-*.csv"))  # archive_log.csv has its own schema
          for p in paths:
              for i, row in enumerate(rows(p, BET_COLS), start=2):
                  b = row["bet_id"]
                  if not b:
                      errs.append(f"{p}:{i}: empty bet_id")
                  elif b in ids:
                      errs.append(f"{p}:{i}: duplicate bet_id {b} (also in {ids[b]})")
                  else:
                      ids[b] = p
          if os.path.exists("data/ledger.csv"):
              rows("data/ledger.csv", ["ts_et", "book", "bet_id", "event_type", "amount", "note"])
          for p in ("data.json", "stats.json", "archive.json", "log.json"):
              if os.path.exists(p):
                  try:
                      with open(p, encoding="utf-8") as f:
                          json.load(f)
                  except Exception as e:
                      errs.append(f"{p}: invalid JSON ({e})")
          print(f"checked {len(paths)} bet file(s), {len(ids)} unique bet_ids")
          if errs:
              print("\n".join(errs)); sys.exit(1)
          PY

      - name: Secret scan
        run: |
          set -euo pipefail
          # bracketed first letters keep this file from matching its own patterns, so it is scanned too
          pat='gh[p]_[A-Za-z0-9]{20,}|github_pa[t]_[A-Za-z0-9_]{20,}|AKI[A][0-9A-Z]{16}|-----BEGI[N] [A-Z ]*PRIVATE KEY|xo[x][bp]-[A-Za-z0-9-]{10,}|sk-an[t]-[A-Za-z0-9_-]{10,}'
          if git grep -nIE -e "$pat"; then
            echo "::error::possible secret committed (see matches above)"; exit 1
          fi
          echo "no secret patterns found"

      - name: No inline scripts or event handlers (CSP script-src 'self')
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, subprocess, sys
          files = subprocess.check_output(["git", "ls-files", "*.html", "*.htm", "*.js"], text=True).split()
          bad = []
          script = re.compile(r"<script\b([^>]*)>(.*?)</script\s*>", re.I | re.S)
          handler = re.compile(r"<[a-z][^>]*\s(on[a-z]+)\s*=", re.I)
          jsurl = re.compile(r"""(?:href|src|action)\s*=\s*["']?\s*javascript:""", re.I)
          for p in files:
              t = open(p, encoding="utf-8", errors="replace").read()
              if p.endswith((".html", ".htm")):
                  for m in script.finditer(t):
                      if m.group(2).strip() and not re.search(r"type\s*=\s*[\"']?(application/(ld\+)?json)", m.group(1), re.I):
                          bad.append(f"{p}: inline <script> body")
                  for m in handler.finditer(t):
                      bad.append(f"{p}: inline event handler {m.group(1)}=")
                  if jsurl.search(t):
                      bad.append(f"{p}: javascript: URL")
              else:
                  # JS files: no HTML-string inline handlers
                  for m in re.finditer(r"""\son(?:click|load|error|change|input|submit|mouse\w+|key\w+)\s*=\s*["']""", t, re.I):
                      bad.append(f"{p}: inline handler inside string near offset {m.start()}")
          print(f"scanned {len(files)} file(s)")
          if bad:
              print("\n".join(sorted(set(bad)))); sys.exit(1)
          PY
