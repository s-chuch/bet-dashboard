name: manual-settle
# Owner taps Win / Void / Loss on an unsettled bet in the Logs page; the page dispatches this workflow.
# Security model: workflow_dispatch needs repo WRITE access (a fine-grained token with Actions: read+write).
# Do NOT add any other trigger (issues, issue_comment, pull_request, repository_dispatch).
# Inputs are validated again inside scripts/manual_settle.py and are never interpolated into shell code.
on:
  workflow_dispatch:
    inputs:
      bet_id:
        description: "bet_id of an open bet (8 hex chars, optional -N suffix)"
        required: true
        type: string
      result:
        description: "Result"
        required: true
        type: choice
        options: [won, lost, void]
      profit:
        description: "Profit in CAD for a win whose to_win is unknown (optional)"
        required: false
        default: ""
        type: string

# Deny everything by default; the job grants only what it needs.
permissions: {}

# shared with autorun so the two never overlap
concurrency:
  group: autorun
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  settle:
    if: github.repository == 's-chuch/bet-dashboard' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # push the data commit to main
    steps:
      - name: Validate inputs
        env:
          BET_ID: ${{ inputs.bet_id }}
          RESULT: ${{ inputs.result }}
          PROFIT: ${{ inputs.profit }}
        run: |
          set -euo pipefail
          # [[ =~ ]] on a single-line check: reject anything containing a newline first
          for v in "$BET_ID" "$RESULT" "$PROFIT"; do
            case "$v" in *$'\n'*|*$'\r'*) echo "::error::invalid input (newline)"; exit 1;; esac
          done
          [[ "$BET_ID" =~ ^[0-9a-f]{8}(-[0-9]{1,3})?$ ]] || { echo "::error::bad bet_id"; exit 1; }
          [[ "$RESULT" =~ ^(won|lost|void)$ ]] || { echo "::error::bad result"; exit 1; }
          [[ -z "$PROFIT" || "$PROFIT" =~ ^[0-9]+(\.[0-9]{1,2})?$ ]] || { echo "::error::bad profit"; exit 1; }

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: true   # required: the retry loop below pushes with this token

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: settle + rebuild + push (retry on push race)
        env:
          TZ: America/Toronto
          GH_TOKEN: ${{ github.token }}
          BET_ID: ${{ inputs.bet_id }}
          RESULT: ${{ inputs.result }}
          PROFIT: ${{ inputs.profit }}
        run: |
          set -euo pipefail
          git config user.name "bet-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pushed=0
          for attempt in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            # a refusal (not found / different result already recorded / bad input) fails the job: no fallthrough.
            # exit 3 = the same result was already recorded (a repeat tap): quiet success, nothing to commit.
            rc=0; python3 scripts/manual_settle.py || rc=$?
            if [ "$rc" -eq 3 ]; then exit 0; fi
            if [ "$rc" -ne 0 ]; then exit "$rc"; fi
            # full normal pass: archive, balances, rec grading, rebuild JSON, needs_review refresh
            python3 scripts/autorun.py || echo "::warning::autorun rebuild reported errors"
            git add -A data data.json stats.json archive.json log.json
            if git diff --cached --quiet; then echo "::error::nothing changed"; exit 1; fi
            git commit -qm "manual settle ${BET_ID} ${RESULT}"
            if git push -q origin HEAD:main; then
              echo "pushed"; pushed=1
              break
            fi
            echo "push rejected (box pushed meanwhile) - redoing on fresh main"; sleep 5
          done
          if [ "$pushed" -ne 1 ]; then echo "::error::could not push after 3 attempts"; exit 1; fi
