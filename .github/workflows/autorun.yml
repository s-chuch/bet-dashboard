name: autorun
# Unattended bet tracker: settle finished bets from ESPN, update ledger balances / Tracker P&L / picks
# grading, rebuild data.json. Commits only when data changed. Scheduled runs can lag 5-20 min on GitHub.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: autorun
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: settle + grade + build (retry on push race)
        env:
          TZ: America/Toronto
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "bet-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          status=0
          for attempt in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 scripts/autorun.py || status=$?
            git add -A data data.json
            if git diff --cached --quiet; then echo "no data changes - nothing to commit"; break; fi
            git commit -qm "autorun $(date '+%Y-%m-%d %H:%M') ET"
            if git push -q origin HEAD:main; then
              echo "pushed"
              # pushes made with GITHUB_TOKEN may not start a Pages build on their own: request one
              gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" >/dev/null && echo "pages build requested" || echo "pages build request failed (non-fatal)"
              break
            fi
            echo "push rejected (box pushed meanwhile) - redoing on fresh main"; sleep 5
          done
          exit $status
