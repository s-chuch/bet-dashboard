name: autorun
# Unattended bet tracker: settle finished bets from ESPN, archive settled bets older than 5 days,
# update ledger balances / Tracker P&L / picks grading, rebuild data.json + stats/archive/log JSON.
# Commits only when data changed. Scheduled runs can lag 5-20 min on GitHub.
# Workflow-file commits must be authored by a repo collaborator (s-chuch) or GitHub may not fire the schedule.
#
# Keep-alive: GitHub auto-disables scheduled workflows after 60 days without repository activity.
# The bot's own commits to main count as activity, so as long as data keeps changing this never
# trips. If the repo goes quiet for 60 days, re-enable it from the Actions tab (or push anything).
on:
  schedule:
    # While the repo is PUBLIC Actions minutes are unlimited: every 5 min, offset from :00 (GitHub drops/delays top-of-hour schedules).
    # After going PRIVATE (README, "Private hosting") switch to:  - cron: "7,37 11-23,0-5 * * *"
    - cron: "2-59/5 * * * *"
  # Event-driven: any push of data/script changes (e.g. the box logging a bet) rebuilds right away. The bot's own
  # commits use GITHUB_TOKEN, which never re-triggers workflows, so there is no loop. This is the reliable path:
  # GitHub's cron is best-effort and may not fire for hours.
  push:
    branches: [main]
    paths: ["data/**", "scripts/**"]
  workflow_dispatch:
    inputs:
      live:
        description: "Live loop: while any bet is active, check for finished games every 5-10 s for up to 55 min (the timer workflow sets this)"
        type: boolean
        default: false

# Deny everything by default; the job grants only what it needs.
permissions: {}

concurrency:
  # live loops queue behind each other only; normal runs behind each other only (cancel-in-progress stays false)
  group: ${{ inputs.live == true && 'autorun-live' || 'autorun' }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  run:
    # forks must not run the bot; manual runs from other branches must not push to main
    if: github.repository == 's-chuch/bet-dashboard' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 70      # a live loop runs up to 55 min; a normal run takes well under a minute
    permissions:
      contents: write   # push data commits to main
      issues: write     # one "Bets need your OK" issue = a phone notification
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1   # history is not needed; the loop fetches origin/main itself
          persist-credentials: true   # required: the retry loop below pushes with this token

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"      # scripts use the stdlib only: no pip install, no cache

      - name: settle + archive + grade + build (retry on push race; live loop when asked)
        id: autorun
        env:
          TZ: America/Toronto
          GH_TOKEN: ${{ github.token }}
          LIVE: ${{ inputs.live }}
        run: |
          set -euo pipefail
          git config user.name "bet-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          status=0      # non-zero = autorun.py failed or nothing could be pushed
          pushed=0
          # one pass: $1 = '' (full: settle, archive, picks, rebuild) or --fast (live: settle check only, rebuild only if a bet settled)
          pass() {
            status=0; pushed=0
            for attempt in 1 2 3; do
              git fetch -q origin main && git reset -q --hard origin/main
              # intentional: keep going after a script failure so partial progress is still committed
              python3 scripts/autorun.py $1 || status=$?
              git add -A data data.json stats.json archive.json log.json
              if git diff --cached --quiet; then pushed=1; break; fi
              git commit -qm "autorun $(date '+%Y-%m-%d %H:%M:%S') ET"
              if git push -q origin HEAD:main; then echo "pushed"; pushed=1; break; fi
              echo "push rejected (box pushed meanwhile) - redoing on fresh main"; sleep 5
            done
            if [ "$pushed" -ne 1 ] && [ "$status" -eq 0 ]; then status=1; echo "::error::could not push after 3 attempts"; fi
          }
          # live loop only: Kalshi prices (it rejects browser requests) -> one rewritten commit on the live-feed branch, read by the Live page
          kalshi() {
            python3 scripts/kalshi_live.py "$RUNNER_TEMP/kalshi.json" 2>/dev/null || return 0
            [ -s "$RUNNER_TEMP/kalshi.json" ] || return 0
            blob=$(git hash-object -w "$RUNNER_TEMP/kalshi.json")
            tree=$(printf '100644 blob %s\tkalshi.json\n' "$blob" | git mktree)
            commit=$(git commit-tree "$tree" -m "kalshi feed $(date -u +%H:%M:%S)")
            git push -q -f origin "$commit:refs/heads/live-feed" || echo "kalshi feed push failed"
          }
          if [ "$LIVE" = "true" ]; then
            echo "LIVE loop: settle check every 5-10 s while any bet is active (max 55 min)"
            pass ""                                      # one full pass first (review list, archive, rebuild)
            end=$((SECONDS + 3300)); n=0; loop0=$SECONDS
            while [ "$SECONDS" -lt "$end" ] && python3 scripts/next_run.py --live-check; do
              t0=$SECONDS; n=$((n + 1))
              pass --fast
              if [ $((n % 2)) -eq 0 ]; then kalshi || true; fi       # every other pass: ~20 s, keeps Kalshi's rate limit happy
              [ "$status" -ne 0 ] && echo "::warning::live pass reported status $status"
              took=$((SECONDS - t0)); left=$((10 - took)); if [ "$left" -lt 5 ]; then left=5; fi
              # one short line per pass so the log shows the real period (pass time + sleep)
              echo "live pass $n at $(date +%H:%M:%S): took ${took}s, sleeping ${left}s, status $status"
              sleep "$left"   # 10 s period, but never closer than 5 s
            done
            echo "live loop finished after $((SECONDS - loop0)) s: $n passes, average period $(( n > 0 ? (SECONDS - loop0) / n : 0 )) s"
            pass ""                                      # final full pass decides the run's status
          else
            pass ""
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Fail if the run had errors
        if: always() && steps.autorun.outputs.status != '0'
        env:
          AUTORUN_STATUS: ${{ steps.autorun.outputs.status }}
        run: |
          set -euo pipefail
          echo "::error::autorun finished with errors (status='${AUTORUN_STATUS:-step did not finish}')"
          exit 1

      - name: Alert when bets need your OK
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NOTIFY_LOGS_URL: https://${{ github.repository_owner }}.github.io/bet-dashboard/log.html#activity
        run: python3 scripts/notify.py
