name: add-bets
# Owner uploads bet-slip screenshots in the "Upload bets" tab; the page reads them with OCR inside the browser (the images
# never leave the phone), the owner checks the draft rows, and the page dispatches this workflow with the confirmed rows.
# Security model: workflow_dispatch needs repo WRITE access (a fine-grained token with Actions: read+write).
# Do NOT add any other trigger (issues, issue_comment, pull_request, repository_dispatch).
# The JSON is validated again inside scripts/add_bets.py and is only ever read from the environment (never from a shell string).
on:
  workflow_dispatch:
    inputs:
      bets:
        description: "JSON array of confirmed bets (max 30), built by the Upload bets page"
        required: true
        type: string

# Deny everything by default; the job grants only what it needs.
permissions: {}

# shared with autorun so the two never overlap
concurrency:
  group: autorun
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  add:
    if: github.repository == 's-chuch/bet-dashboard' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # push the data commit to main
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: true   # required: the retry loop below pushes with this token

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: add bets + rebuild + push (retry on push race)
        env:
          TZ: America/Toronto
          GH_TOKEN: ${{ github.token }}
          BETS_JSON: ${{ inputs.bets }}
        run: |
          set -euo pipefail
          git config user.name "bet-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pushed=0
          for attempt in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            # a refusal (bad input / unknown book) fails the job before anything is written
            python3 scripts/add_bets.py
            python3 scripts/autorun.py || echo "::warning::autorun rebuild reported errors"
            git add -A data data.json stats.json archive.json log.json
            if git diff --cached --quiet; then echo "::notice::nothing changed (all bets were already in the tracker)"; exit 0; fi
            git commit -qm "upload bets: add bets from screenshots"
            if git push -q origin HEAD:main; then
              echo "pushed"; pushed=1
              break
            fi
            echo "push rejected (box pushed meanwhile) - redoing on fresh main"; sleep 5
          done
          if [ "$pushed" -ne 1 ]; then echo "::error::could not push after 3 attempts"; exit 1; fi
