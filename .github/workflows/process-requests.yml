name: process-requests
# Multi-user backend: applies queued requests (add bets, manual settle, set balance) for every Supabase user, then settles
# finished games (ESPN finals only) and refreshes each user's private snapshots. Only users with profiles.rules.cutover=true
# are settled/published on a timer; requests from anyone are always applied. Safe no-op until accounts are cut over.
on:
  schedule:
    - cron: "1-59/5 * * * *"
  workflow_dispatch:
    inputs:
      user:
        description: "Only this email (blank = everyone)"
        required: false
        default: ""

permissions: {}
concurrency:
  group: process-requests
  cancel-in-progress: false

jobs:
  process:
    if: github.repository == 's-chuch/bet-dashboard' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Process requests, settle, publish
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          USER_EMAIL: ${{ inputs.user }}
        run: |
          args=(--settle)
          [ -n "$USER_EMAIL" ] && args+=(--user "$USER_EMAIL")
          python3 scripts/process_requests.py "${args[@]}"
