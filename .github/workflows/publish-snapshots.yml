name: publish-snapshots
# Phase 2: build each Supabase user's data/stats/log/archive JSON and store it in the private `snapshots` table.
# Manual only for now: the CSVs are still the source of truth until writes move to Supabase (phase 3/4),
# so a scheduled run would publish stale rows.
on:
  workflow_dispatch:
    inputs:
      user:
        description: "Only this email (blank = every user)"
        required: false
        default: ""
      no_network:
        description: "Skip ESPN/odds lookups (stats/log/archive only)"
        type: boolean
        default: false

permissions: {}
concurrency:
  group: publish-snapshots
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 's-chuch/bet-dashboard' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Publish snapshots
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          USER_EMAIL: ${{ inputs.user }}
          NO_NET: ${{ inputs.no_network }}
        run: |
          args=()
          [ -n "$USER_EMAIL" ] && args+=(--user "$USER_EMAIL")
          [ "$NO_NET" = "true" ] && args+=(--no-network)
          python3 scripts/publish_snapshots.py "${args[@]}"
