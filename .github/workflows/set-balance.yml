name: set-balance
# Owner types the real app balance of a book on the Logs page; if open bets do not explain the gap,
# the page dispatches this workflow to set a fresh balance snapshot (ledger "anchor") for that book.
# Security model: workflow_dispatch needs repo WRITE access (a fine-grained token with Actions: read+write).
# Do NOT add any other trigger (issues, issue_comment, pull_request, repository_dispatch).
# Inputs are validated below and again inside scripts/set_balance.py and are never interpolated into shell code.
on:
  workflow_dispatch:
    inputs:
      book:
        description: "Sportsbook"
        required: true
        type: choice
        options: [PointsBet, bet365, FanDuel, DraftKings, theScore, Caesars, Hard Rock]
      amount:
        description: "Cash balance shown in the app, CAD (e.g. 123.45)"
        required: true
        type: string
      note:
        description: "Optional short note"
        required: false
        default: ""
        type: string

# Deny everything by default; the job grants only what it needs.
permissions: {}

# shared with autorun so the two never overlap
concurrency:
  group: autorun
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  set-balance:
    if: github.repository == 's-chuch/bet-dashboard' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # push the data commit to main
    steps:
      - name: Validate inputs
        env:
          BOOK: ${{ inputs.book }}
          AMOUNT: ${{ inputs.amount }}
          NOTE: ${{ inputs.note }}
        run: |
          set -euo pipefail
          for v in "$BOOK" "$AMOUNT" "$NOTE"; do
            case "$v" in *$'\n'*|*$'\r'*) echo "::error::invalid input (newline)"; exit 1;; esac
          done
          case "$BOOK" in
            "PointsBet"|"bet365"|"FanDuel"|"DraftKings"|"theScore"|"Caesars"|"Hard Rock") ;;
            *) echo "::error::bad book"; exit 1;;
          esac
          [[ "$AMOUNT" =~ ^[0-9]+(\.[0-9]{1,2})?$ ]] || { echo "::error::bad amount"; exit 1; }
          awk -v a="$AMOUNT" 'BEGIN { exit !(a + 0 <= 100000) }' || { echo "::error::amount too large"; exit 1; }
          [[ "$NOTE" =~ ^[A-Za-z0-9\ .,:()#/+-]{0,80}$ ]] || { echo "::error::bad note"; exit 1; }

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: true   # required: the retry loop below pushes with this token

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: set balance + rebuild + push (retry on push race)
        env:
          TZ: America/Toronto
          GH_TOKEN: ${{ github.token }}
          BOOK: ${{ inputs.book }}
          AMOUNT: ${{ inputs.amount }}
          NOTE: ${{ inputs.note }}
        run: |
          set -euo pipefail
          git config user.name "bet-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pushed=0
          for attempt in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 scripts/set_balance.py
            # full normal pass: archive, balances, rec grading, rebuild JSON, needs_review refresh
            python3 scripts/autorun.py || echo "::warning::autorun rebuild reported errors"
            git add -A data data.json stats.json archive.json log.json
            if git diff --cached --quiet; then echo "::error::nothing changed"; exit 1; fi
            git commit -qm "set balance ${BOOK} ${AMOUNT}"
            if git push -q origin HEAD:main; then
              echo "pushed"; pushed=1
              break
            fi
            echo "push rejected (box pushed meanwhile) - redoing on fresh main"; sleep 5
          done
          if [ "$pushed" -ne 1 ]; then echo "::error::could not push after 3 attempts"; exit 1; fi
