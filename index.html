<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0f1115">
<title>Live Bets</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--line:#262a33;--txt:#e8eaed;--mut:#8b919c;--win:#22c55e;--lose:#ef4444;--push:#f59e0b;--pre:#64748b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:12px 12px calc(24px + env(safe-area-inset-bottom))}
h1{font-size:18px;margin:4px 0 2px}h2{font-size:14px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:18px 2px 8px}
.meta{color:var(--mut);font-size:12px}
.bal{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:10px}
.bal div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;justify-content:space-between}
.bal .tot{grid-column:1/-1;font-weight:700;font-size:17px}
.sum{display:flex;gap:6px;margin-top:6px}.sum div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:12px;color:var(--mut)}.sum b{display:block;color:var(--txt);font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--pre);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.card.WINNING,.card.WON{border-left-color:var(--win)}.card.LOSING,.card.LOST{border-left-color:var(--lose)}.card.PUSH,.card.TIED{border-left-color:var(--push)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.pill{font-size:12px;font-weight:800;padding:3px 8px;border-radius:999px;background:var(--pre);color:#fff;white-space:nowrap}
.pill.WINNING,.pill.WON{background:var(--win)}.pill.LOSING,.pill.LOST{background:var(--lose)}.pill.PUSH,.pill.TIED{background:var(--push)}
.pick{font-size:17px;font-weight:700;margin:4px 0 2px}.ev{color:var(--mut);font-size:13px}
.nums{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;margin-top:6px}.nums span b{color:var(--txt)}.nums span{color:var(--mut)}
.score{margin-top:8px;padding:8px;background:#11141a;border-radius:8px;font-variant-numeric:tabular-nums}
.score .row{display:flex;justify-content:space-between}.score .det{color:var(--mut);font-size:12px;margin-top:2px}
.score .live{color:var(--win);font-weight:700}
.leg{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:5px 0;border-top:1px solid var(--line)}.leg:first-child{border-top:0}
.leg .pill{font-size:10px;padding:2px 6px;flex-shrink:0;align-self:flex-start}
.set{font-size:13px;display:flex;justify-content:space-between;padding:6px 2px;border-bottom:1px solid var(--line)}
.wp{margin-top:8px}.wp .lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-bottom:3px}.wp .lbl b{color:var(--txt);font-size:13px}
.wp .track{height:8px;background:#2a2f39;border-radius:99px;overflow:hidden}.wp .fill{height:100%;border-radius:99px;transition:width .8s ease,background .3s}
.wp .note{font-size:11px;color:var(--mut);margin-top:2px}
h2 span{text-transform:none;letter-spacing:0;color:var(--txt);float:right}
.pos{color:var(--win)}.neg{color:var(--lose)}
.card{padding:0;overflow:hidden;margin-bottom:6px;border-radius:10px}
.crow{display:flex;align-items:center;gap:8px;min-height:50px;padding:6px 10px 7px 8px;position:relative;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}
.crow .pill{font-size:10px;padding:3px 6px;min-width:62px;text-align:center;flex-shrink:0}
.cmid{flex:1;min-width:0}.clbl{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.csub{font-size:11px;color:var(--mut);white-space:nowrap}.csub b{color:var(--txt);font-weight:600}
.cright{text-align:right;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap;flex-shrink:0;max-width:42%;overflow:hidden;text-overflow:ellipsis}.cright small{display:block;font-size:11px;color:var(--mut)}
.chev{color:var(--mut);font-size:16px;transition:transform .2s;flex-shrink:0}.card.open .chev{transform:rotate(90deg)}
.mini{position:absolute;left:0;bottom:0;height:3px;border-radius:0 2px 2px 0}
.cbody{display:none;padding:2px 12px 10px;border-top:1px solid var(--line)}.card.open .cbody{display:block}
.h2row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:18px 2px 8px}.h2row h2{margin:0;flex:1}
.h2row h2.sechead{cursor:pointer}.h2row h2 .chev{display:inline-block;margin-right:4px}.sec.open .h2row h2 .chev{transform:rotate(90deg)}
.xall{background:none;border:1px solid var(--line);color:var(--mut);border-radius:999px;font-size:11px;padding:4px 10px;flex-shrink:0}
.sec.settled .secbody{display:none}.sec.settled.open .secbody{display:block}
</style></head><body>
<h1>Live Bets</h1>
<div class="meta" id="meta">Loading…</div>
<div class="bal" id="bal"></div>
<div class="sum" id="sum"></div>
<div class="sec" id="sec-live"><div class="h2row"><h2>Live now <span id="liveN"></span></h2><button class="xall" data-sec="sec-live"></button></div><div class="secbody"><div id="live"></div></div></div>
<div class="sec" id="sec-up"><div class="h2row"><h2>Upcoming <span id="upN"></span></h2><button class="xall" data-sec="sec-up"></button></div><div class="secbody"><div id="bets"></div></div></div>
<div class="sec settled" id="sec-won"><div class="h2row"><h2 class="sechead" data-sec="sec-won"><span class="chev">›</span>Won / Push <span id="wonTot"></span></h2><button class="xall" data-sec="sec-won"></button></div><div class="secbody"><div id="wonCards"></div><div id="won"></div></div></div>
<div class="sec settled" id="sec-lost"><div class="h2row"><h2 class="sechead" data-sec="sec-lost"><span class="chev">›</span>Lost <span id="lostTot"></span></h2><button class="xall" data-sec="sec-lost"></button></div><div class="secbody"><div id="lostCards"></div><div id="lost"></div></div></div>
<script>
const ESPN="https://site.api.espn.com/apis/site/v2/sports/";
const TZ="America/Toronto";
let DATA=null, games={}, summaries={};
const $=id=>document.getElementById(id);
const money=v=>v==null?"?":"$"+Number(v).toFixed(2);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(Boolean);
function teamMatch(q,t){const qn=norm(q);if(!qn.length)return false;
  for(const f of [t.name,t.abbr,t.short,t.location,t.nick]){const fn=norm(f);if(fn.length&&fn.join(" ")===qn.join(" "))return true}
  const d=norm(t.name);return qn.every(w=>d.includes(w))&&(qn.length>1||qn[0].length>3)}
function fromEvent(ev){const c=ev.competitions?ev.competitions[0]:ev.header.competitions[0];const st=ev.status||c.status;
  return {date:ev.date||c.date,state:st.type.state,completed:st.type.completed,detail:st.type.shortDetail,
    teams:c.competitors.map(x=>({name:x.team.displayName,abbr:x.team.abbreviation,short:x.team.shortDisplayName,location:x.team.location,nick:x.team.name,home:x.homeAway==="home",score:x.score&&typeof x.score==="object"?x.score.displayValue:x.score}))}}
const key=m=>m.path+"|"+m.date+"|"+(m.groups||"");
function gameFor(m){if(!m)return null;return games[m.id]||m.snapshot}
async function getJSON(u){const r=await fetch(u,{cache:"no-store"});if(!r.ok)throw new Error(r.status);return r.json()}
const PROB_PATHS=new Set(["football/nfl","football/college-football","baseball/mlb","basketball/nba","basketball/wnba","basketball/mens-college-basketball"]);
const probs={}, probCount={}, pregameLive={};
let espnErr=false;
function allMatches(){const ms=[];for(const b of DATA.open){if(b.match)ms.push(b.match);for(const L of b.legs)if(L.match)ms.push(L.match)}return ms}
const etDay=d=>new Date(d).toLocaleDateString("en-CA",{timeZone:TZ});
function isActive(m){const g=gameFor(m);if(!g||g.completed)return false;if(g.state==="in")return true;
  return g.date&&new Date(g.date).getTime()-Date.now()<20*60000}  // live, or starting within 20 min
async function espn(u){try{const r=await fetch(u,{cache:"no-store"});if(r.status===429||r.status>=500){espnErr=true;return null}
  if(!r.ok)return null;return await r.json()}catch(e){espnErr=true;return null}}
const corePath=m=>{const[sp,lg]=m.path.split("/");return`https://sports.core.api.espn.com/v2/sports/${sp}/leagues/${lg}/events/${m.id}/competitions/${m.id}`};
// full=true: every unfinished game (60s cycle); full=false: only live / about-to-start games (10s cycle)
async function refreshScores(full){
  const need={};for(const m of allMatches()){const g=gameFor(m);if(g&&g.completed)continue;if(!full&&!isActive(m))continue;need[key(m)]=m}
  await Promise.all(Object.values(need).map(async m=>{
    const d=await espn(`${ESPN}${m.path}/scoreboard?dates=${m.date}`+(m.groups?`&groups=${m.groups}`:""));
    for(const ev of (d&&d.events)||[]){games[ev.id]=fromEvent(ev);
      const p=ev.competitions[0].situation&&ev.competitions[0].situation.lastPlay&&ev.competitions[0].situation.lastPlay.probability;
      if(p&&p.homeWinPercentage!=null)probs[ev.id]={home:p.homeWinPercentage,away:p.awayWinPercentage,t:Date.now(),src:"sb"}}}));
  // player props need the box score (only in-progress SGPs with a prop leg)
  await Promise.all(DATA.open.filter(b=>b.match&&b.legs.some(L=>L.type==="prop")).map(async b=>{
    const g=gameFor(b.match);if(!g||g.state==="pre")return;if(summaries[b.match.id]&&summaries[b.match.id].done)return;
    const d=await espn(`${ESPN}${b.match.path}/summary?event=${b.match.id}`);if(d)summaries[b.match.id]={d,done:g.completed}}));
}
// live win probability: tiny ESPN core API pages (latest play's probability), only for in-progress games in covered sports
async function refreshProbs(){
  const ids={};for(const b of DATA.open){const m=probMatch(b);if(m)ids[m.id]=m}
  await Promise.all(Object.values(ids).map(async m=>{const g=gameFor(m);
    if(!g||g.state!=="in"||!PROB_PATHS.has(m.path))return;
    if(probs[m.id]&&probs[m.id].src==="sb"&&Date.now()-probs[m.id].t<15000)return; // scoreboard already gave a fresh one
    let page=probCount[m.id]||1;
    let d=await espn(`${corePath(m)}/probabilities?limit=1&page=${page}`);if(!d||d.error)return;
    if(d.count&&d.count!==page){probCount[m.id]=d.count;d=await espn(`${corePath(m)}/probabilities?limit=1&page=${d.count}`);if(!d||d.error)return}
    const it=d.items&&d.items[0];if(it&&it.homeWinPercentage!=null)probs[m.id]={home:it.homeWinPercentage,away:it.awayWinPercentage,t:Date.now(),src:"core"}}));
}
// pregame predictor: refetch only for games starting later today (data.json carries a snapshot for the rest)
async function refreshPregame(){
  const today=etDay(Date.now()),ids={};for(const b of DATA.open){const m=probMatch(b);if(m)ids[m.id]=m}
  await Promise.all(Object.values(ids).map(async m=>{const g=gameFor(m);
    if(!g||g.state!=="pre"||!PROB_PATHS.has(m.path)||etDay(g.date)!==today)return;
    const d=await espn(`${corePath(m)}/predictor`);if(!d||d.error)return;
    const gp=s=>((d[s]||{}).statistics||[]).find(x=>x.name==="gameProjection");const h=gp("homeTeam"),a=gp("awayTeam");
    if(h&&a)pregameLive[m.id]={home:h.value,away:a.value}}));
}
// which game + team a bar can honestly describe
function probTarget(b){
  if(b.multi){if(!b.match)return null;const t=b.legs.filter(L=>L.team);return t.length===1?{m:b.match,leg:t[0]}:null}
  const L=b.legs[0];if(!L||!L.team)return null;return{m:b.match||L.match,leg:L}}
function probMatch(b){const t=probTarget(b);return t&&t.m}
function probFor(b){const t=probTarget(b);if(!t||!t.m)return null;const g=gameFor(t.m);if(!g||g.completed)return null;
  const i=sideIdx(g,t.leg.team);if(i<0)return null;const home=g.teams[i].home,name=g.teams[i].abbr||g.teams[i].name;
  const ml=t.leg.type==="ml"&&!b.multi;
  const lp=g.state==="in"&&probs[t.m.id];
  if(lp){const v=home?lp.home:(lp.away!=null?lp.away:1-lp.home);return{pct:v*100,kind:"live",label:ml?`${name} live win chance`:`${name} team win chance (live)`,ml}}
  const pg=pregameLive[t.m.id]||t.m.pregame;
  if(pg){return{pct:home?pg.home:pg.away,kind:"pregame",label:ml?`${name} win chance · Pregame`:`${name} team win chance · Pregame`,ml}}
  return null}
function wpBar(b){const p=probFor(b);if(!p)return"";const v=Math.max(0,Math.min(100,p.pct));
  const col=v>50?"var(--win)":v<50?"var(--lose)":"var(--push)";
  const note=!p.ml?(b.multi?"Game-win chance for that team only, not the parlay's chance":"Chance to win the game, not to cover"):(p.kind==="pregame"?"ESPN pregame predictor":"ESPN live win probability");
  return`<div class="wp"><div class="lbl"><span>${esc(p.label)}</span><b>${v.toFixed(1)}%</b></div><div class="track"><div class="fill" style="width:${v}%;background:${col}"></div></div><div class="note">${note}</div></div>`}
function sideIdx(g,team){return g.teams.findIndex(t=>teamMatch(team,t))}
function legStatus(L,g,sport,matchId){
  if(!g)return{s:"NO GAME",n:"Live score not found"};
  if(g.state==="pre")return{s:"NOT STARTED",n:""};
  const fin=g.completed, sc=g.teams.map(t=>Number(t.score||0)), W=fin?"WON":"WINNING", Lo=fin?"LOST":"LOSING";
  if(L.type==="ml"||L.type==="spread"){const i=sideIdx(g,L.team);if(i<0)return{s:"?",n:"team not matched"};
    const m=sc[i]-sc[1-i]+(L.type==="spread"?L.line:0);
    if(m>0)return{s:W,n:L.type==="spread"?`covering by ${m}`:""};
    if(m<0)return{s:Lo,n:L.type==="spread"?`short by ${-m}`:""};
    if(L.type==="ml"&&sport==="Soccer")return{s:Lo,n:"draw loses a 3-way ML"};
    return{s:fin?"PUSH":(L.type==="ml"?"TIED":"PUSH"),n:""}}
  if(L.type==="total"){const t=sc[0]+sc[1],d=t-L.line;
    if(d===0)return{s:"PUSH",n:`total ${t}`};
    const over=L.side==="over";
    if(over&&d>0)return{s:fin?"WON":"WON",n:`total ${t}, already over`};
    if(!over&&d>0)return{s:"LOST",n:`total ${t}, already over`};
    return{s:over?Lo:W,n:`total ${t}, ${(-d).toFixed(1)} under the line`}}
  if(L.type==="prop"){const S=summaries[matchId];if(!S)return{s:"?",n:"waiting for box score"};
    let v=null;for(const tm of (S.d.boxscore||{}).players||[])for(const cat of tm.statistics||[]){const k=(cat.keys||[]).indexOf(L.stat);if(k<0)continue;
      for(const a of cat.athletes||[])if(norm(a.athlete.displayName).includes(norm(L.player)[0]))v=Number(a.stats[k])}
    if(v==null)return{s:fin?"LOST":"LOSING",n:`${L.player}: no stats yet`};
    if(v>=L.min)return{s:"WON",n:`${L.player}: ${v} pass TD`};
    return{s:fin?"LOST":"LOSING",n:`${L.player}: ${v} pass TD, needs ${L.min}`}}
  return{s:"?",n:"can't compute"}}
function combine(st){if(st.some(s=>s==="LOST"))return"LOST";if(st.every(s=>s==="WON"))return"WON";
  if(st.some(s=>s==="LOSING"))return"LOSING";if(st.every(s=>s==="NOT STARTED"))return"NOT STARTED";
  if(st.every(s=>s==="WON"||s==="WINNING"))return"WINNING";if(st.every(s=>s==="WON"||s==="WINNING"||s==="NOT STARTED"))return"WINNING";
  if(st.some(s=>s==="TIED"||s==="PUSH"))return"TIED";return"LIVE"}
const cls=s=>s.replace(/\s/g,"_");
function fmtStart(g,raw){if(g&&g.date){const d=new Date(g.date);return d.toLocaleString("en-CA",{timeZone:TZ,weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})+" ET"}return raw}
function scoreBox(g){if(!g)return"";const live=g.state==="in";
  const order=[...g.teams].sort((a,b)=>a.home-b.home);
  return `<div class="score">${order.map(t=>`<div class="row"><span>${esc(t.name)}</span><b>${g.state==="pre"?"":esc(t.score)}</b></div>`).join("")}
    <div class="det">${live?'<span class="live">● LIVE</span> ':""}${g.state==="pre"?"Not started":esc(g.detail)}</div></div>`}
const BOOKS={PointsBet:"PB",Caesars:"CZR",FanDuel:"FD",DraftKings:"DK",bet365:"365",theScore:"SCORE","Hard Rock":"HR",BetMGM:"MGM"};
const bookTag=b=>BOOKS[b]||b;
const cardKey=b=>[b.date,b.book,b.event,b.pick].join("|");
let OPEN=new Set(), SECS=new Set();
try{OPEN=new Set(JSON.parse(localStorage.getItem("bd_open")||"[]"));SECS=new Set(JSON.parse(localStorage.getItem("bd_secs")||"[]"))}catch(e){}
const saveUI=()=>{try{localStorage.setItem("bd_open",JSON.stringify([...OPEN]));localStorage.setItem("bd_secs",JSON.stringify([...SECS]))}catch(e){}};
const fmtLine=v=>(v>0?"+":"")+v;
function shortLabel(b,g){
  const team=t=>{if(!g)return null;const i=sideIdx(g,t);return i<0?null:g.teams[i]};
  const aw=g&&g.teams.find(t=>!t.home),hm=g&&g.teams.find(t=>t.home), matchup=g?`${aw.abbr}/${hm.abbr}`:"";
  if(b.multi)return b.match?`SGP ${g?aw.abbr+" @ "+hm.abbr:""} · ${b.legs.length} legs`:`${b.legs.length}-leg parlay`;
  const L=b.legs[0];if(!L)return b.pick;
  if(L.type==="ml"){const t=team(L.team);return `${t?(t.nick||t.short||t.name):L.team} ML`}
  if(L.type==="spread"){const t=team(L.team);return `${t?t.abbr:L.team} ${fmtLine(L.line)}`}
  if(L.type==="total")return `${L.side==="under"?"U":"O"} ${L.line} ${matchup}`;
  return b.pick}
function rowScore(b,g,legStats){
  const start=x=>{const d=new Date(x.date),today=etDay(Date.now())===etDay(x.date);
    return d.toLocaleString("en-US",{timeZone:TZ,...(today?{}:{weekday:"short"}),hour:"numeric",minute:"2-digit"})};
  const one=x=>{if(!x)return"";const aw=x.teams.find(t=>!t.home),hm=x.teams.find(t=>t.home);
    if(x.state==="pre")return `${start(x)}<small>${today(x)?"Today":"Starts"} ET</small>`;
    return `${esc(aw.abbr)} ${esc(aw.score)}–${esc(hm.score)} ${esc(hm.abbr)}<small>${x.completed?"Final":esc(x.detail.replace(" - "," "))}</small>`};
  const today=x=>etDay(Date.now())===etDay(x.date);
  if(g)return one(g);
  const gs=legStats.map(x=>x.g).filter(Boolean);if(!gs.length)return"";
  const live=gs.find(x=>x.state==="in");if(live)return one(live);
  const fin=gs.filter(x=>x.completed).length;
  if(fin===gs.length)return `${fin}/${b.legs.length} final<small>${legStats.filter(x=>x.s==="WON").length} won</small>`;
  const nx=gs.filter(x=>x.state==="pre").sort((a,c)=>new Date(a.date)-new Date(c.date))[0];return nx?one(nx):""}
function syncUI(){
  document.querySelectorAll(".card[data-k]").forEach(c=>c.classList.toggle("open",OPEN.has(c.dataset.k)));
  document.querySelectorAll(".sec.settled").forEach(s=>s.classList.toggle("open",SECS.has(s.id)));
  document.querySelectorAll(".xall").forEach(bt=>{const cs=[...document.querySelectorAll(`#${bt.dataset.sec} .card[data-k]`)];
    bt.style.display=cs.length?"":"none";bt.textContent=cs.length&&cs.every(c=>OPEN.has(c.dataset.k))?"Collapse all":"Expand all"})}
document.addEventListener("click",e=>{
  const bt=e.target.closest(".xall");if(bt){const cs=[...document.querySelectorAll(`#${bt.dataset.sec} .card[data-k]`)];
    const all=cs.every(c=>OPEN.has(c.dataset.k));cs.forEach(c=>all?OPEN.delete(c.dataset.k):OPEN.add(c.dataset.k));
    if(!all&&bt.closest(".sec.settled"))SECS.add(bt.dataset.sec);saveUI();syncUI();return}
  const sh=e.target.closest(".sechead");if(sh){SECS.has(sh.dataset.sec)?SECS.delete(sh.dataset.sec):SECS.add(sh.dataset.sec);saveUI();syncUI();return}
  const row=e.target.closest(".crow");if(row){const k=row.parentElement.dataset.k;OPEN.has(k)?OPEN.delete(k):OPEN.add(k);saveUI();syncUI()}});
function render(){
  const D=DATA;$("bal").innerHTML=D.balances.map(b=>`<div><span>${esc(b.book)}</span><b>${money(b.balance)}</b></div>`).join("")+`<div class="tot"><span>Total</span><span>${money(D.total)}</span></div>`;
  $("sum").innerHTML=`<div>Open bets<b>${D.open.length}</b></div><div>At risk<b>${money(D.open_stake)}</b></div><div>Tracker P&amp;L<b class="${D.pnl_total>=0?"pos":"neg"}">${D.pnl_total>=0?"+":""}${money(D.pnl_total)}</b></div>`;
  const liveCards=[],upCards=[],wonCards=[],lostCards=[];let lostPending=0,wonPending=0;
  D.open.forEach(b=>{
    const legStats=b.legs.map(L=>{const g=b.match?gameFor(b.match):gameFor(L.match);return{L,g,...legStatus(L,g,b.sport,b.match&&b.match.id)}});
    let status=b.multi?combine(legStats.map(x=>x.s)):(legStats[0]?legStats[0].s:"?");
    const g=b.match?gameFor(b.match):null;
    const price=b.boosted_price&&b.boosted_price!==b.price?`${esc(b.price)} → ${esc(b.boosted_price)}`:esc(b.price);
    const firstG=g||legStats.map(x=>x.g).find(Boolean);
    const k=cardKey(b), isOpen=OPEN.has(k), p=probFor(b);
    const mini=p?`<div class="mini" style="width:${Math.max(0,Math.min(100,p.pct))}%;background:${p.pct>50?"var(--win)":p.pct<50?"var(--lose)":"var(--push)"}"></div>`:"";
    const rs=rowScore(b,g,legStats);
    let html=`<div class="card ${cls(status)}${isOpen?" open":""}" data-k="${esc(k)}"><div class="crow"><span class="pill ${cls(status)}">${status==="NOT STARTED"?"UPCOMING":status}</span>
      <div class="cmid"><div class="clbl">${esc(shortLabel(b,g||firstG))}</div><div class="csub">${esc(bookTag(b.book))} · <b>${money(b.stake)}</b>${b.to_win!=null?` → ${money(b.to_win)}`:""}</div></div>
      <div class="cright">${rs}</div><span class="chev">›</span>${mini}</div><div class="cbody">
      <div class="top" style="margin-top:8px"><span class="tag">${esc(b.sport||"?")} · ${esc(b.book)}</span></div>
      <div class="pick">${esc(b.pick)}</div><div class="ev">${esc(b.event)} · ${esc(b.market)}</div>
      <div class="nums"><span>Price <b>${price}</b></span><span>Stake <b>${money(b.stake)}</b>${b.stake_note?" (unconf.)":""}</span><span>To win <b>${b.to_win==null?"TBC":money(b.to_win)}</b></span><span>Start <b>${esc(fmtStart(firstG,b.start))}</b></span></div>`;
    if(b.multi){html+=`<div class="score">`+legStats.map(x=>`<div class="leg"><span>${esc(x.L.text)}${x.n?` <span class="meta">· ${esc(x.n)}</span>`:""}${!b.match&&x.g?`<br><span class="meta">${x.g.teams.map(t=>esc(t.abbr||t.name)+" "+(x.g.state==="pre"?"":esc(t.score))).join(" – ")} · ${esc(x.g.state==="pre"?fmtStart(x.g):x.g.detail)}</span>`:""}</span><span class="pill ${cls(x.s)}">${x.s}</span></div>`).join("")+`</div>`;
      if(g)html+=scoreBox(g)}
    else{const x=legStats[0];html+=scoreBox(x&&x.g);if(x&&x.n)html+=`<div class="meta" style="margin-top:4px">${esc(x.n)}</div>`}
    html+=wpBar(b)+`</div></div>`;
    const gs=(b.match?[gameFor(b.match)]:b.legs.map(L=>gameFor(L.match))).filter(Boolean);
    const t=Math.min(...gs.map(g=>g.date?new Date(g.date).getTime():Infinity),Infinity);
    if(status==="LOST"){lostCards.push(html);lostPending+=b.stake||0}
    else if(gs.some(g=>g.state==="in"))liveCards.push(html);
    else if(gs.length&&gs.length===(b.match?1:b.legs.length)&&gs.every(g=>g.completed)){wonCards.push(html);if(status==="WON")wonPending+=b.to_win||0}
    else upCards.push({html,t})});
  upCards.sort((a,b)=>a.t-b.t);
  $("live").innerHTML=liveCards.join("")||'<div class="meta">Nothing live right now.</div>';
  $("bets").innerHTML=upCards.map(x=>x.html).join("")||'<div class="meta">Nothing upcoming.</div>';
  $("liveN").textContent=liveCards.length||"";$("upN").textContent=upCards.length||"";
  $("wonCards").innerHTML=wonCards.length?`<div class="meta" style="margin:0 2px 6px">Final, not settled in the tracker yet</div>`+wonCards.join(""):"";
  const row=s=>`<div class="set"><span>${esc(s.date.slice(5))} ${esc(s.book)} · ${esc(s.pick)}</span><b class="${(s.pnl||0)>=0?"pos":"neg"}">${s.pnl==null?esc(s.result):((s.pnl>=0?"+":"−")+money(Math.abs(s.pnl)))}</b></div>`;
  const st=D.settled_recent||[], lostS=st.filter(s=>/lost|loss/i.test(s.result)), wonS=st.filter(s=>!/lost|loss/i.test(s.result));
  const wonSum=wonS.reduce((a,s)=>a+(s.pnl||0),0), lostSum=lostS.reduce((a,s)=>a-(s.pnl||0),0);
  $("won").innerHTML=(wonS.length?`<div class="meta" style="margin:8px 2px 2px">Settled, last 2 days</div>`:"")+wonS.map(row).join("")||(wonCards.length?"":'<div class="meta">None in the last 2 days.</div>');
  $("wonTot").textContent=wonS.length?`+${money(wonSum)}`:"";
  $("lostCards").innerHTML=lostCards.length?`<div class="meta" style="margin:0 2px 6px">Graded LOST live, not settled in the tracker yet</div>`+lostCards.join(""):"";
  $("lost").innerHTML=(lostS.length?`<div class="meta" style="margin:8px 2px 2px">Settled, last 2 days</div>`:"")+lostS.map(row).join("")||(lostCards.length?"":'<div class="meta">None in the last 2 days.</div>');
  const lostTotal=lostSum+lostPending;
  $("lostTot").textContent=lostTotal?`−${money(lostTotal)}`+(lostPending?` (incl. ${money(lostPending)} unsettled)`:""):"";
  const now=new Date().toLocaleTimeString("en-CA",{timeZone:TZ,hour:"numeric",minute:"2-digit",second:"2-digit"});
  const gen=D.generated_at?new Date(D.generated_at).toLocaleString("en-CA",{timeZone:TZ,month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}):"?";
  syncUI();
  $("meta").textContent=`Scores updated ${now} ET · scores every ${FAST/1000|0}s · bets as of ${gen} ET`;
}
let FAST=10000, fastTimer=null, loading=false;
async function loadData(){try{DATA=await getJSON("data.json?t="+Date.now())}catch(e){if(!DATA){$("meta").textContent="Couldn't load data.json";return false}}return true}
async function fastTick(full){clearTimeout(fastTimer);if(!DATA||loading)return schedule();loading=true;espnErr=false;
  try{await refreshScores(full);await refreshProbs();if(full)await refreshPregame()}finally{loading=false}
  FAST=espnErr?30000:10000;render();schedule()}
function schedule(){clearTimeout(fastTimer);if(!document.hidden)fastTimer=setTimeout(()=>fastTick(false),FAST)}
async function slowTick(){if(await loadData()){render();if(!document.hidden)fastTick(true)}}
slowTick();setInterval(slowTick,60000);           // data.json every 60s
document.addEventListener("visibilitychange",()=>{if(document.hidden)clearTimeout(fastTimer);else fastTick(true)});
</script></body></html>
